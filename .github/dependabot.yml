version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors too: an action's major is usually a new runtime, and one pull request per action
      # was five at once on the first run.
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
