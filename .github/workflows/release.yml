name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache in a job that builds the release: a poisoned cache would ship.
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and source version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.mjs
      - name: Run quality gate
        run: npm run ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run extension smoke test
        run: npm run smoke
      - name: Build Store ZIP
        run: npm run package:store
      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls release/*.zip)" >> "$GITHUB_OUTPUT"
      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@9e84b492001753fcc2c640c4b7b8ff4445bf0866 # v0.5.0
        with:
          path: ${{ steps.zip.outputs.path }}
      - name: Attest Store ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Upload Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: region-snap-store-package
          path: release/*.zip

  desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache in a job that builds the release: a poisoned cache would ship.
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run desktop capture test
        run: npm run desktop:test
      - name: Check signing availability
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Note deferred Windows installer
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          "### Windows installer deferred" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Configure WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD, then rerun this workflow to attach the signed installer." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Build NSIS installer
        if: github.ref_type != 'tag' || steps.signing.outputs.enabled == 'true'
        run: npm run desktop:dist
      - name: Verify Authenticode signatures
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $targets = @(
            "release\\win-unpacked\\Region Snap.exe",
            (Get-ChildItem "release\\Region-Snap-Setup-*.exe").FullName
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne "Valid") {
              throw "$target is not signed with a valid Authenticode certificate."
            }
          }
      - name: Upload Windows installer
        if: github.ref_type != 'tag' || steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: region-snap-windows-installer
          path: release/Region-Snap-Setup-*.exe

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [extension, desktop]
    runs-on: ubuntu-latest
    permissions:
      # Creates the GitHub Release and uploads its files.
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ${{ needs.desktop.outputs.signed == 'true' && 'Includes the Chrome extension package and signed Windows installer.' || 'The Chrome extension package is available now. The signed Windows installer will be attached after the code-signing certificate is configured.' }}

            Check the extension ZIP: `gh attestation verify <zip> --owner vannt-dev`
          files: release/*
