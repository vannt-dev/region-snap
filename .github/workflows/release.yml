name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and source version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.mjs
      - name: Run quality gate
        run: npm run ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run extension smoke test
        run: npm run smoke
      - name: Build Store ZIP
        run: npm run package:store
      - name: Upload Store package
        uses: actions/upload-artifact@v6
        with:
          name: region-snap-store-package
          path: release/*.zip

  desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop capture test
        run: npm run desktop:test
      - name: Check signing availability
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Note deferred Windows installer
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          "### Windows installer deferred" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Configure WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD, then rerun this workflow to attach the signed installer." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Build NSIS installer
        if: github.ref_type != 'tag' || steps.signing.outputs.enabled == 'true'
        run: npm run desktop:dist
      - name: Verify Authenticode signatures
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $targets = @(
            "release\\win-unpacked\\Region Snap.exe",
            (Get-ChildItem "release\\Region-Snap-Setup-*.exe").FullName
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne "Valid") {
              throw "$target is not signed with a valid Authenticode certificate."
            }
          }
      - name: Upload Windows installer
        if: github.ref_type != 'tag' || steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: region-snap-windows-installer
          path: release/Region-Snap-Setup-*.exe

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [extension, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ needs.desktop.outputs.signed == 'true' && 'Includes the Chrome extension package and signed Windows installer.' || 'The Chrome extension package is available now. The signed Windows installer will be attached after the code-signing certificate is configured.' }}
          files: release/*
