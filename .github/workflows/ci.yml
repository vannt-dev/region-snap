name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, Test, Build, Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci
      - name: Create Store package
        run: npm run package:store
      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls release/*.zip)" >> "$GITHUB_OUTPUT"
      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@f066757b2c013f4bac44be401727e6742bf4ce64 # v0.6.0
        with:
          path: ${{ steps.zip.outputs.path }}
      - name: Upload Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: region-snap-store-package
          path: release/*.zip

  smoke:
    name: Chromium Extension Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build extension
        run: npm run build
      - name: Run smoke test
        run: npm run smoke

  desktop:
    name: Windows Desktop E2E and Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop capture test
        run: npm run desktop:test
      - name: Build NSIS installer
        run: npm run desktop:dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: region-snap-windows-installer
          path: release/Region-Snap-Setup-*.exe

  # The one check branch protection requires: it passes when every job above passed or was
  # skipped, and fails on a failure or a cancellation.
  ci-result:
    name: CI result
    if: always()
    needs: [quality, smoke, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
