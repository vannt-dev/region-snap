name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Test, Build, Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci
      - name: Create Store package
        run: npm run package:store
      - name: Upload Store package
        uses: actions/upload-artifact@v6
        with:
          name: region-snap-store-package
          path: release/*.zip

  smoke:
    name: Chromium Extension Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build extension
        run: npm run build
      - name: Run smoke test
        run: npm run smoke

  desktop:
    name: Windows Desktop E2E and Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run desktop capture test
        run: npm run desktop:test
      - name: Build NSIS installer
        run: npm run desktop:dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: region-snap-windows-installer
          path: release/Region-Snap-Setup-*.exe
